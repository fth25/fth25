  <g>
    <animateTransform attributeName="transform" type="translate" values="40,75; 740,75; 740,75; 40,75" keyTimes="0; 0.48; 0.52; 1" dur="16s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1,1; 1,1; -1,1; -1,1" keyTimes="0; 0.48; 0.52; 1" dur="16s" repeatCount="indefinite"/>
      <path d="M -15,-5 A 15,15 0 0,1 15,-5 L 15,15 L 11,10 L 7,15 L 3,10 L -1,15 L -5,10 L -9,15 L -13,10 L -15,15 Z" fill="#ff0044"/>
      <circle cx="-6" cy="-5" r="4" fill="#fff"/>
      <circle cx="6" cy="-5" r="4" fill="#fff"/>
      <circle cx="-5" cy="-5" r="2" fill="#0033cc"/>
      <circle cx="7" cy="-5" r="2" fill="#0033cc"/>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="100,75; 800,75; 800,75; 100,75" keyTimes="0; 0.48; 0.52; 1" dur="16s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="-1,1; -1,1; 1,1; 1,1" keyTimes="0; 0.48; 0.52; 1" dur="16s" repeatCount="indefinite"/>
      <path fill="#ffdd00">
        <animate attributeName="d" dur="0.3s" repeatCount="indefinite" keyTimes="0;0.5;1"
                 values="M 0,0 L -25,-15 A 30,30 0 1,1 -25,15 Z;M 0,0 L -30,-0.5 A 30,30 0 1,1 -30,0.5 Z;M 0,0 L -25,-15 A 30,30 0 1,1 -25,15 Z"/>
      </path>
