    <circle cx="250" cy="75" r="4"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.10;0.12;1" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="75" r="4"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.17;0.19;1" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="75" r="4"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.26;1" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="75" r="4"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.31;0.33;1" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="75" r="4"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.38;0.40;1" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="75" r="4"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.47;1" dur="16s" repeatCount="indefinite"/></circle>
